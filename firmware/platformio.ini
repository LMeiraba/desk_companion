[platformio]
default_envs = desk-companion

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; -------------------------------------------------------------------------
; Desk Companion Production Firmware (Adafruit GFX / Official Stable Driver)
; Screen: 2.8" SPI TFT (ILI9341) on GPIO 4 (SCK), 6 (MOSI), 7 (DC), 5 (CS), 10 (BL)
; Rotary Encoder 1: GPIO 2 (CLK), GPIO 3 (DT), GPIO 9 / PCF8574 P4 (SW)
; I2C Expander: GPIO 0 (SDA), GPIO 1 (SCL)
; -------------------------------------------------------------------------
[env:desk-companion]
build_src_filter = -<*> +<main.cpp>
lib_deps = 
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit ILI9341 @ ^1.6.1
    bblanchon/ArduinoJson @ ^7.0.0
    links2004/WebSockets @ ^2.4.1
build_flags = 
    ${env.build_flags}

; -------------------------------------------------------------------------
; 2.8" SPI TFT Display Test (Adafruit ILI9341 / Official Standard Driver)
; SCL -> GPIO 4 | SDA -> GPIO 6 | DC -> GPIO 7 | CS -> GPIO 5
; Backlight -> 3.3V (or GPIO 10) | RST -> 3.3V
; -------------------------------------------------------------------------
[env:tft-tester]
build_src_filter = -<*> +<tft_tester.cpp>
lib_deps = 
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit ILI9341 @ ^1.6.1
build_flags = 
    ${env.build_flags}

; -------------------------------------------------------------------------
; PCF8574T I2C Expander Pin-Touch Diagnostic Tester
; SDA -> GPIO 0 | SCL -> GPIO 1
; -------------------------------------------------------------------------
[env:pcf8574-tester]
build_src_filter = -<*> +<pcf8574_tester.cpp>
